<svg xmlns="http://www.w3.org/2000/svg" width="430" height="943" viewBox="0 0 430 943" fill="none">
  <title>Ironhavn Wallet — sample portfolio</title>
  <desc>The current Wallet interface with illustrative balances totaling $47,832.50. Bitcoin $21,946.08; Ethereum $11,756.67; USDC $8,317.47; WBTC $5,012.28; AERO $800.00.</desc>
  <!-- Marketing fixture, not live prices or wallet data. Quantities × prices round to each displayed value; all five values sum to the portfolio total. -->
  <defs>
    <radialGradient id="violet" cx="100%" cy="0%" r="90%"><stop stop-color="#18152e"/><stop offset="1" stop-color="#07090e" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal" cx="0%" cy="100%" r="70%"><stop stop-color="#0a2524" stop-opacity=".65"/><stop offset="1" stop-color="#07090e" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="20" y1="850" x2="410" y2="916" gradientUnits="userSpaceOnUse"><stop stop-color="#294247" stop-opacity=".92"/><stop offset=".5" stop-color="#18272d" stop-opacity=".96"/><stop offset="1" stop-color="#20202b" stop-opacity=".96"/></linearGradient>
    <linearGradient id="glass-edge" x1="20" y1="850" x2="410" y2="916" gradientUnits="userSpaceOnUse"><stop stop-color="#466065"/><stop offset=".5" stop-color="#2b3b45"/><stop offset="1" stop-color="#30313e"/></linearGradient>
    <g id="bitcoin"><text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="600" fill="white">₿</text></g>
    <g id="ethereum"><rect x="-10" y="-10" width="20" height="20" rx="3" transform="rotate(45)" fill="white"/></g>
    <g id="dollar"><text x="0" y="8" text-anchor="middle" font-size="27" font-weight="700" fill="white">$</text></g>
    <g id="aero" stroke="white" stroke-width="2.5" stroke-linejoin="round"><path d="m-13 6 13-17 13 17-13-5z"/><path d="m-13 6 13 6 13-6"/></g>
    <path id="chevron" d="m0-4 4 4-4 4" stroke="#8c93a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <style>
    text { font-family: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f5f5fa; }
    .muted { fill: #8c93a6; font-weight: 500; }
    .name { font-size: 19px; font-weight: 700; }
    .quantity { font-size: 18px; font-weight: 600; }
    .value { font-size: 14px; }
    .price { font-size: 12px; }
    .tab { font-size: 10px; font-weight: 500; text-anchor: middle; }
  </style>
  <path fill="#07090e" d="M0 0h430v943H0z"/>
  <path fill="url(#violet)" d="M0 0h430v943H0z"/>
  <path fill="url(#teal)" d="M0 0h430v943H0z"/>
  <!-- iOS status bar and Dynamic Island, retained inside the existing animated device. -->
