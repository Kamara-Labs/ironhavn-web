  <rect x="155" y="10" width="120" height="33" rx="17" fill="#000"/>
  <g fill="#f5f5fa"><rect x="305" y="30" width="3.5" height="5" rx="1"/><rect x="311" y="27" width="3.5" height="8" rx="1"/><rect x="317" y="24" width="3.5" height="11" rx="1"/><rect x="323" y="21" width="3.5" height="14" rx="1"/></g>
